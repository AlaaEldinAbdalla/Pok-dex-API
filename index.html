<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex-API</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon.png">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/colors.css">

    <script src="./script.js" defer></script>
    <script src="./js/template.js" defer></script>
</head>

<body onload="init()">

    <header class="page-header">

        <div class="page-wrapper page-header__content">

            <div class="header-brand">
                <img src="./assets/images/logo.png" alt="Pokédex Logo" class="header-logo">
                <h1 class="page-title">Pokedex</h1>
            </div>

            <div class="search-container">

                <div class="search-controls">

                    <input type="text" class="search-input" id="searchInput" data-id="search-input"
                        placeholder="Suchen..." onkeydown="searchOnKeydown(event)" oninput="handleSearchInput()"
                        onblur="validateSearch()">

                    <button type="button" class="clear-search-btn d-none" id="clearSearchBtn" onclick="clearSearch()"
                        aria-label="Suche löschen">
                        ✕
                    </button>
                    <button type="button" data-id="search-button" onclick="searchPkm()" aria-label="Pokémon suchen">
                        🔍
                    </button>
                </div>

                <div id="searchError"></div>

            </div>
        </div>

    </header>

    <main class="page-body" data-id="content">

        <div id="loadingSpinner" class="loader-overlay d-none">
            <div class="pokeball"></div>
            <p>Loading...</p>
        </div>

        <div class="page-wrapper page-body__content">

            <ul id="pokemonContainer" class="pokemon-container"></ul>

            <button id="loadMoreBtn" class="load-more-btn" data-id="load-more-button" onclick="loadMorePokemons()">
                Load more Pokémon
            </button>

        </div>

    </main>

    <footer class="page-footer">
        <div class="page-wrapper page-footer__content">
            <p class="page-footer-copy">
                &copy; 2026 AAM. Alle Rechte vorbehalten.
            </p>
        </div>
    </footer>

    <dialog id="pkmDialog" class="pkm-dialog" aria-label="Pokémon Details" data-id="dialog" onclick="closeBackdrop(event)">
        <div class="pkm-dialog-content" data-id="overlay-pokemon-name">

            <header class="pkm-dialog-header">
                <button type="button" class="close-btn" data-id="close-dialog-button" onclick="closePkmDialog()"
                    aria-label="Dialog schließen">
                    x
                </button>
            </header>

            <div class="pkm-dialog-main">
                <div id="pkmDialogBody" data-id="dialog-pokemon-content"></div>
            </div>

            <footer class="pkm-dialog-footer">
                <button type="button" class="nav-btn prevPkm" data-id="prev-button" onclick="prevPokemon()"
                    aria-label="Vorheriges Pokémon">
                    ❮
                </button>

                <button type="button" class="nav-btn nextPkm" data-id="next-button" onclick="nextPokemon()"
                    aria-label="Nächstes Pokémon">
                    ❯
                </button>
            </footer>

        </div>
    </dialog>


</body>

</html>
