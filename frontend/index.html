<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex-API</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icon/favicon.png">

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/colors.css">

    <script src="./script.js" defer></script>
    <script src="./js/template.js" defer></script>
</head>

<body onload="init()">

    <header class="page-header">

        <div class="page-wrapper page-header__content">

            <div class="header-brand">
                <img src="./assets/img/logo.png" alt="Pokédex Logo" class="header-logo">
                <h1 class="page-title">Pokedex</h1>
            </div>

            <div class="search-container">

                <div class="search-controls">
                    <input type="text" class="search-input" id="searchInput" placeholder="Suchen..."
                        onkeydown="searchOnKeydown(event)" oninput="handleSearchInput()" onblur="validateSearch()">

                    <button type="button" class="clear-search-btn d-none" id="clearSearchBtn" onclick="clearSearch()">
                        ✕
                    </button>

                    <button type="button" onclick="searchPkm()">🔍</button>
                </div>

                <div id="searchError"></div>

            </div>

    </header>

    <main class="page-body">
        <div id="loadingSpinner" class="loader-overlay d-none">
            <div class="pokeball"></div>
            <p>Loading...</p>
        </div>

        <div class="page-wrapper page-body__content">

            <div id="pokemonContainer" class="pokemon-container"></div>

            <button id="loadMoreBtn" class="load-more-btn" onclick="loadMorePokemons()">
                Load more Pokémon
            </button>

        </div>

    </main>

    <footer class="page-footer">
        <div class="page-wrapper page-footer__content">
            <p class="page-footer-copy">
                &copy; 2026 AAM. Alle Rechte vorbehalten.
            </p>
        </div>
    </footer>

    <div id="pkmDialog" class="pkm-dialog d-none" onclick="closeBackdrop(event)">
        <div class="pkm-dialog-content">

            <header class="pkm-dialog-header">
                <button class="close-btn" onclick="closePkmDialog()">x</button>
            </header>

            <div class="pkm-dialog-main">
                <div id="pkmDialogBody"></div>
            </div>

            <footer class="pkm-dialog-footer">
                <button class="nav-btn prevPkm" onclick="prevPokemon()">❮</button>
                <button class="nav-btn nextPkm" onclick="nextPokemon()">❯</button>
            </footer>

        </div>
    </div>


</body>

</html>
